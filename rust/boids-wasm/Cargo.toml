[package]
name = "boids-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Threaded build: rayon over the per-bird loop via wasm-bindgen-rayon.
# Needs nightly + `-Z build-std` and `+atomics,+bulk-memory,+mutable-globals`;
# see scripts/build-wasm.sh. The page must be cross-origin isolated to use it.
parallel = ["dep:rayon", "dep:wasm-bindgen-rayon"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
rayon = { version = "1.12", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
